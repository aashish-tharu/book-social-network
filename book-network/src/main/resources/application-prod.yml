spring:
  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect
  mail:
    host: ${MAIL_HOST}
    port: 587
    username: ${MAIL_USERNAME}
    password: ${MAIL_PASSWORD}
    properties:
      mail:
        smtp:
          auth: true
          starttls:
            enable: true

application:
  security:
    jwt:
      secret-Key: ${JWT_SECRET}
      expiration: 86400000
  mailing:
    frontend:
      activation-url: ${FRONTEND_ACTIVATION_URL}
  file:
    upload:
      photos-output-path: ./uploads

server:
  port: ${PORT:8088}