spring:
  datasource:
    url: ${DB_URL}
    driver-class-name: org.postgresql.Driver
  jpa:
    hibernate:
      ddl-auto: update
    database: postgresql
    database-platform: org.hibernate.dialect.PostgreSQLDialect

application:
  security:
    jwt:
      secret-Key: ${JWT_SECRET}
      expiration: 86400000
  mailing:
    brevo:
      api-key: ${BREVO_API_KEY:dummy_key}
      sender-email: ${BREVO_SENDER_EMAIL:dummy@example.com}
    frontend:
      activation-url: ${FRONTEND_ACTIVATION_URL}
  file:
    upload:
      photos-output-path: ./uploads

server:
  port: ${PORT:8088}