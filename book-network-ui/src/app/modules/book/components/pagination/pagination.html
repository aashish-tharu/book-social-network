<nav class="pager" aria-label="Pagination">
  <button type="button" class="pager-button" (click)="previous()" [disabled]="page <= 0">
    <i class="fas fa-arrow-left" aria-hidden="true"></i>
    <span>Previous</span>
  </button>
  <span class="pager-count">Page {{ currentPageLabel }} of {{ totalPages }}</span>
  <button type="button" class="pager-button" (click)="next()" [disabled]="page + 1 >= totalPages">
    <span>Next</span>
    <i class="fas fa-arrow-right" aria-hidden="true"></i>
  </button>
</nav>
